name: Backend
on:
  push:
    paths: ["backend/**", "shared/**", "tsconfig.base.json", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "shared/**", "tsconfig.base.json", ".github/workflows/backend.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:http
      - name: Build deployment image
        working-directory: .
        run: docker build --file backend/Dockerfile --tag retrest-api:test .
